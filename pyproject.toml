[project]
name = "verification-engine-backend"
version = "0.1.0"
description = "FastAPI backend for the Enterprise Financial Verification Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.19",
  "python-jose[cryptography]>=3.3.0",
  "email-validator>=2.2.0",
  "bcrypt>=4.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
